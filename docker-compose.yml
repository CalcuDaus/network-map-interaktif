services:
  netmap:
    build:
      context: .
      dockerfile: Dockerfile
    image: netmap:latest
    pull_policy: build
    container_name: netmap-app
    restart: unless-stopped
    ports:
      - "3020:80"
    networks:
      - netmap_network
    environment:
      - TZ=Asia/Jakarta

networks:
  netmap_network:
    driver: bridge


